name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare vcpkg cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\*.exe dist\
          Copy-Item build\Release\*.dll dist\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\lensfun dist\lensfun -Recurse
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist\RawDeveloper.exe
          Copy-Item README.md dist\
          Get-ChildItem dist | Select-Object Name, Length

      - name: Self test (synthetic DNG)
        shell: pwsh
        run: |
          python -m pip install --quiet numpy tifffile
          python tests\make_test_dng.py test.dng
          dist\rd_selftest.exe test.dng

      - name: UI smoke test (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:RD_TEST_SCRIPT = "$PWD\uitest"
          $p = Start-Process -FilePath dist\RawDeveloper.exe -ArgumentList "$PWD\test.dng" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "UI test timed out" }
          foreach ($i in 1..6) { if (-not (Test-Path "uitest_$i.png")) { throw "screenshot $i missing" } }
          Get-ChildItem uitest_*.png | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RawDeveloper-windows
          path: dist
